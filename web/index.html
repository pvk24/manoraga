<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManoRaga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600&display=swap">
<style>
/* VOICE everyday: a warm, knowledgeable friend at a kutcheri, not a dashboard
   IDEA a silk saree: deep maroon body, gold zari border framing the conversation
   PICTURE the conversation itself, with recommendation cards that act like concert programme slips
   COLOUR white ground, maroon dominant, zari gold accent, peacock green for actions; night keeps the silk
   TYPE Rozha One for the name, Hind for everything else
   LAYOUT chat column with taste panel beside it on laptop; panel becomes a drawer below 900px */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#140f11);--ink:light-dark(#22161b,#f3ece8);--mute:light-dark(#6d5a61,#b9a9ae);--line:light-dark(#eadfe2,#33262b);--panel:light-dark(#fbf6f3,#1c1518);--maroon:light-dark(#7b1631,#5a1024);--maroon-ink:#fff6ef;--gold:light-dark(#c98a12,#e6b04a);--green:light-dark(#0e6b5b,#46b59c);--bubble:light-dark(#f6eef0,#241a1e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Hind,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{background:var(--maroon);color:var(--maroon-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,3vw)}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font:400 30px/1.05 "Rozha One",Georgia,serif;margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:14px;opacity:.85}
.zari{height:12px;flex:none;background:linear-gradient(var(--gold),var(--gold)) top/100% 2px no-repeat,linear-gradient(var(--gold),var(--gold)) bottom/100% 2px no-repeat,repeating-linear-gradient(135deg,var(--maroon) 0 4px,var(--gold) 4px 6px,var(--maroon) 6px 10px)}
.ghost{background:transparent;border:1px solid color-mix(in srgb,var(--maroon-ink) 45%,transparent);color:var(--maroon-ink);border-radius:999px;padding:8px 16px;min-height:44px}
.ghost:hover{background:color-mix(in srgb,var(--maroon-ink) 12%,transparent)}
.app{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
.chat{display:flex;flex-direction:column;min-height:0}
.log{flex:1;overflow-y:auto;padding:24px max(16px,4vw) 12px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:min(680px,92%);padding:12px 16px;border-radius:18px;overflow-wrap:anywhere}
.msg p{margin:0 0 8px}.msg p:last-child,.msg ul:last-child,.msg ol:last-child{margin-bottom:0}
.bot a{color:var(--green);text-decoration:underline;text-underline-offset:2px}
.msg ul,.msg ol{margin:0 0 8px;padding-left:22px}
.bot{background:var(--bubble);border-top-left-radius:4px;align-self:flex-start}
.me{background:var(--maroon);color:var(--maroon-ink);border-top-right-radius:4px;align-self:flex-end;white-space:pre-wrap}
.err{border:1px solid var(--line);background:transparent;color:var(--mute)}
.dots{display:inline-flex;gap:5px;padding:6px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
.trace{align-self:flex-start;font-size:14px;color:var(--mute);margin-top:-6px;max-width:min(680px,92%);border-left:3px solid var(--green);padding:4px 0 4px 12px}
.trace summary{cursor:pointer;color:var(--green);font-weight:500;min-height:32px;display:flex;align-items:center}
.trace ol{margin:4px 0 0;padding-left:20px}.trace li{margin-bottom:6px;overflow-wrap:anywhere}.trace b{color:var(--ink);font-weight:600}.trace p{margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:680px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;min-height:40px;text-align:left}
.chip:hover{border-color:var(--gold)}
.pick-label{align-self:flex-start;font-size:12.5px;color:var(--muted,#7a5a4f);font-style:italic;margin:-2px 0 -4px 2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-self:flex-start;width:min(680px,100%)}
.card{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.card .rg{font-size:13px;color:var(--mute)}
.card b{font-size:17px;font-weight:600;line-height:1.25}
.card .by{font-size:14px;color:var(--mute)}
.card .why{font-size:14px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;min-height:36px;font-size:14px;text-decoration:none;color:var(--ink)}
.act svg{width:16px;height:16px}
.act:hover{border-color:var(--green)}
.act[aria-pressed=true].like{background:var(--green);border-color:var(--green);color:#fff}
.act[aria-pressed=true].nope{background:var(--mute);border-color:var(--mute);color:var(--bg)}
.diag{font-size:13px;color:var(--mute);margin:6px 0 0}
.notice{margin:0 max(16px,4vw) 8px;padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.composer{display:flex;gap:8px;align-items:flex-end;margin:0 max(16px,4vw);padding:8px;border:1.5px solid var(--line);border-radius:22px;background:var(--bg)}
.composer:focus-within{border-color:var(--gold)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;padding:8px 10px;font-size:16px;max-height:160px;outline:none}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--maroon);color:var(--maroon-ink);display:grid;place-items:center}
.send:disabled{opacity:.4;cursor:default}
.send svg{width:20px;height:20px}
.fine{font-size:13px;color:var(--mute);margin:6px max(16px,4vw) 12px;text-align:center}
.taste{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.taste h2{font:400 24px/1.1 "Rozha One",Georgia,serif;margin:0}
.taste h3{font-size:14px;font-weight:600;margin:0 0 6px;color:var(--mute)}
.thead{display:flex;justify-content:space-between;align-items:center}
.close{display:none;border:1px solid var(--line);background:transparent;border-radius:999px;min-height:40px;padding:0 14px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;min-height:40px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--maroon);color:var(--maroon-ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px}
.tag button{border:0;background:transparent;width:28px;height:28px;border-radius:50%;color:var(--mute)}
.tag button:hover{background:var(--line)}
.tog{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;min-height:36px;font-size:14px}
.tog[aria-pressed=true]{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--bg))}
.empty{font-size:14px;color:var(--mute);margin:0}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;min-height:44px;text-align:left;font-size:15px}
.btn:hover{border-color:var(--gold)}
.danger{color:light-dark(#a3192f,#ff8a9a)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px}
.switch input{width:20px;height:20px;accent-color:var(--green)}
.status{font-size:13px;color:var(--mute);margin:0}
.hbtns{display:flex;gap:8px;align-items:center}
.review{position:fixed;inset:0 0 0 auto;width:min(600px,100%);z-index:6;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;transform:translateX(100%);transition:transform .2s;box-shadow:-8px 0 24px rgb(0 0 0/.18)}
.review.open{transform:none}
.review h2{font:400 24px/1.1 "Rozha One",Georgia,serif;margin:0}
.review .close{display:inline-block}
.rintro{font-size:14px;color:var(--mute);margin:0}
.rcard{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;background:var(--bg);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rcard[data-status=accepted]{border-left-color:var(--green)}.rcard[data-status=rejected]{border-left-color:var(--mute);opacity:.75}
.rcard .rh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rcard .rh b{font-size:16px;font-weight:600}
.rk{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);white-space:nowrap}
.pill.accepted{background:var(--green);border-color:var(--green);color:#fff}.pill.rejected{background:var(--line)}
.rf{display:grid;grid-template-columns:110px 1fr;gap:2px 10px;margin:0}.rf dt{color:var(--mute)}.rf dd{margin:0;overflow-wrap:anywhere}
.rq{margin:0;padding-left:10px;border-left:2px solid var(--line);color:var(--mute);font-style:italic;overflow-wrap:anywhere}
.rcard a{color:var(--green);overflow-wrap:anywhere}
.rcard .notice{margin:2px 0}
.redit{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center}
.redit input[type=text]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);min-height:36px}
.rmoods{display:flex;flex-wrap:wrap;gap:4px 12px;grid-column:1/-1}.rmoods label{display:flex;gap:6px;align-items:center;font-size:13px}
.rexport textarea{width:100%;min-height:160px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
.rcount{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:var(--gold);color:#2a1a10;font-size:13px;font-weight:600;margin-left:6px;padding:0 6px}
@media(prefers-reduced-motion:reduce){.review{transition:none}}
@media(max-width:899px){.app{grid-template-columns:minmax(0,1fr)}.taste{position:fixed;inset:0 0 0 auto;width:min(360px,100%);z-index:5;transform:translateX(100%);transition:transform .2s;box-shadow:-8px 0 24px rgb(0 0 0/.15)}.taste.open{transform:none}.close{display:block}}
@media(min-width:900px){#tasteBtn{display:none}}
@media(max-width:600px){.brand h1{font-size:24px}.brand p{display:none}.brand svg{width:32px;height:32px}.msg{max-width:96%}}
@media(prefers-reduced-motion:reduce){.taste{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="27" r="11" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="27" r="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".7"/><path d="M20 16V3M17 4h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="27" r="2" fill="currentColor"/></svg>
    <div><h1>ManoRaga</h1><p>Your friendly guide to Carnatic music</p></div>
  </div>
  <div class="hbtns">
    <button id="reviewBtn" class="ghost" type="button" aria-controls="review" aria-expanded="false" hidden>Review</button>
    <button id="tasteBtn" class="ghost" type="button" aria-controls="taste" aria-expanded="false">Your taste</button>
  </div>
</header>
<div class="zari" aria-hidden="true"></div>
<main class="app">
  <section class="chat" aria-label="Conversation">
    <div id="log" class="log" aria-live="polite"></div>
    <div id="notice" class="notice" hidden></div>
    <form id="composer" class="composer">
      <textarea id="msg" rows="1" placeholder="Ask about a raaga, or tell me how your day went" aria-label="Message"></textarea>
      <button id="send" class="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
    <p class="fine">Facts come from a curated catalogue of <span id="nR">40</span> raagas and <span id="nK">74</span> krithis, checked against Karnatik.com, Shivkumar.org and Rasikas.org.</p>
  </section>
  <aside id="taste" class="taste" aria-label="Your taste"></aside>
  <aside id="review" class="review" aria-label="Review suggestions"></aside>
</main>

      <div class="row"><button class="btn" type="button" data-rv="applyall" ${acc ? '' : 'disabled'}>Add ${acc || 'all'} accepted to catalogue</button></div>
    </div>
    <div class="rexport"><h3>Export to your repo</h3>
      <p class="rintro">${notInRepo ? `<b>${notInRepo} change${notInRepo > 1 ? 's are' : ' is'} live in this page but not in your repo yet.</b> ` : ''}${acc} accepted, ${pend} undecided. Export, then import in the repo so the CSVs (and friends' copies) get them too; undecided ones join the terminal agent's queue.</p>
      <div class="row"><button class="btn" type="button" data-rv="export" ${acc + pend + notInRepo ? '' : 'disabled'}>Export for the repo</button><button class="btn" type="button" data-rv="refresh">Refresh</button></div>
      ${REV.exportJSON ? `<p class="rintro">Save this as <b>manoraga-suggestions.json</b> in your repo folder, then run <code>python -m carnatic.review import manoraga-suggestions.json</code> (or <code>/import</code> in the terminal chat with --curator). Or ask Claude to "import the ManoRaga suggestion box".</p>
        <textarea readonly aria-label="Export">${esc(REV.exportJSON)}</textarea>
        <div class="row"><button class="btn" type="button" data-rv="copy">Copy</button>${REV.canSave ? '<button class="btn" type="button" data-rv="download">Download</button>' : ''}<button class="btn" type="button" data-rv="mark">Mark these as exported</button></div>` : ''}
    </div>`;
}
$('#review').addEventListener('click', e => {
  const b = e.target.closest('[data-rv]'); if (!b) return;
  const a = b.dataset.rv, id = b.dataset.id;
  if (a === 'close') openReview(false);
  else if (a === 'accept') saveDecision(id, {status: 'accepted'});
  else if (a === 'reject') saveDecision(id, {status: 'rejected'});
  else if (a === 'undo') { const d = {...(REV.dec[id] || {})}; delete d.status; REV.dec[id] = d; saveDecision(id, {}); }
  else if (a === 'edit') { REV.editing = id; renderReview(); }
  else if (a === 'cancel') { REV.editing = null; renderReview(); }
  else if (a === 'refresh') loadReview();
  else if (a === 'export') { const its = REV.items.filter(open_); REV.exportIds = its.map(it => it.id);
    REV.exportJSON = JSON.stringify({format: 'manoraga-suggestions/1', exported_at: new Date().toISOString(), items: its.map(merged)}, null, 2); renderReview(); }
  else if (a === 'copy') { const t = $('#review textarea'); t.select(); try { navigator.clipboard.writeText(REV.exportJSON).catch(() => document.execCommand('copy')); } catch (x) { document.execCommand('copy'); } b.textContent = 'Copied'; }
  else if (a === 'apply') applyItems([REV.items.find(x => x.id === id)]);
  else if (a === 'applyall') applyItems(REV.items.filter(x => open_(x) && dec(x).status === 'accepted'));
  else if (a === 'unapply') unapply(id);
  else if (a === 'download') { use('downloads').then(d => d ? d.save({filename: 'manoraga-suggestions.json', data: REV.exportJSON}) : null)
      .then(() => {}, err => { if (!(err && /cancel|declin|abort/i.test(String(err.code || err.name || '')))) { REV.err = 'Download didn\'t work (' + ((err && err.code) || 'error') + '). Use Copy instead.'; renderReview(); } }); }
  else if (a === 'mark') { for (const i of REV.exportIds) REV.dec[i] = {...(REV.dec[i] || {}), exported: true}; REV.exportJSON = null; saveDecision(null); }
});
$('#review').addEventListener('change', e => { if (e.target.dataset.rv === 'done') { REV.showDone = e.target.checked; renderReview(); } });
$('#review').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, id = f.dataset.form, it = REV.items.find(x => x.id === id); if (!it) return;
  const fd = new FormData(f), edits = {}, checked = n => fd.getAll(n);
  if (it.type === 'addition') { edits.record = {}; for (const k of (it.kind === 'raaga' ? RG_FIELDS : KR_FIELDS)) { const v = String(fd.get(k) || '').trim(); if (v !== String(it.record[k] || '')) edits.record[k] = v; } const was = merged(it).record.moods || [], now = checked('moods'); edits.moods = was.filter(m => now.includes(m)).concat(now.filter(m => !was.includes(m))); }   // keep primary-first order
  else if (it.field) edits.suggested_value = String(fd.get('suggested_value') || '').trim();
  else { edits.remove_moods = checked('remove_moods'); edits.add_moods = checked('add_moods'); }
  REV.editing = null; saveDecision(id, {edits, note: String(fd.get('note') || '').trim()});
});
const overlayRef = () => DB.doc('catalog/overlay');
let overlayBusy = false;
async function writeOverlay(changes) { await overlayRef().set({changes: JSON.parse(JSON.stringify(changes)), updated: new Date().toISOString()}); }
async function applyItems(items) {
  if (overlayBusy || !items.length) return;
  overlayBusy = true; REV.err = '';
  const before = OVERLAY.changes, added = [], problems = [], at = new Date().toISOString();
  for (const it of items) {                       // check each against the catalogue as it grows
    const m = merged(it), err = checkChange(m), name = it.type === 'addition' ? (m.record.title || m.record.name) : it.item_name;
    if (err) { problems.push(`${name}: ${err}`); continue; }
    applyChange(m, at.slice(0, 10)); added.push({id: it.id, entry: {...m, status: 'applied'}, at});
  }
  if (added.length) {
    try { await writeOverlay([...before, ...added]); useOverlay([...before, ...added]); for (const c of added) REV.dec[c.id] = {...(REV.dec[c.id] || {}), status: 'applied', at}; saveDecision(null); }
    catch (e) { useOverlay(before); problems.unshift('Couldn\'t save to the catalogue (' + ((e && e.code) || 'error') + '). Nothing was added.'); }
  } else useOverlay(before);
  REV.err = problems.length ? 'Not added: ' + problems.join(' · ') : ''; overlayBusy = false; renderReview();
}
async function unapply(id) {
  if (overlayBusy) return; overlayBusy = true;
  const before = OVERLAY.changes, after = before.filter(c => c.id !== id);
  try { await writeOverlay(after); useOverlay(after); REV.dec[id] = {...(REV.dec[id] || {}), status: 'accepted'}; saveDecision(null);
    const broken = Object.values(OVERLAY.states).filter(x => x.state === 'error'); REV.err = broken.length ? `${broken.length} other change(s) depended on it and are now not applied.` : ''; }
  catch (e) { REV.err = 'Couldn\'t remove it (' + ((e && e.code) || 'error') + ').'; }
  overlayBusy = false; renderReview();
}
function openReview(o) { $('#review').classList.toggle('open', o); $('#reviewBtn').setAttribute('aria-expanded', o); if (o) { openPanel(false); loadReview(); } }
$('#reviewBtn').addEventListener('click', () => openReview(!$('#review').classList.contains('open')));
async function initReview() {
  const user = await use('user'); if (!user || !DB) return;
  const yes = async f => { try { return typeof user[f] === 'function' ? await user[f]() : false; } catch (e) { return false; } };
  REV.on = (await yes('isOwner')) || (await yes('canEdit'));
  REV.canSave = !!(await use('downloads'));
  if (REV.on) loadReview();
}

welcome(); renderTaste(); initStore().then(initReview);
}
</script>
